# iOS CI — Yomi

name: iOS CI

on:
  push:
    branches: [feature/ios-port, develop/**, ui/**]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:

jobs:
  project-lint:
    name: Project generator + structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated Xcode project is current
        run: python3 ios/tools/generate_xcodeproj.py --check

  yomikit-tests:
    name: YomiKit unit tests (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run YomiKit test suite
        run: |
          set -o pipefail
          swift test --package-path ios/YomiKit 2>&1 | tee ios-test-output.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yomikit-test-log
          path: ios-test-output.log

  build-ios-app:
    name: Build Yomi app (iOS Simulator, unsigned)
    runs-on: macos-15
    needs: [project-lint, yomikit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Yomi.xcodeproj \
            -scheme Yomi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
      - name: Upload built app (unsigned simulator build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-simulator-app
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Yomi.app
          if-no-files-found: warn

  # Unsigned physical-device IPA for free Apple ID signing (Sideloadly/AltStore).
  # Build is fully unsigned; signing happens locally on the user's Windows PC —
  # Apple credentials never enter GitHub Actions.
  build-unsigned-ipa:
    name: Unsigned device IPA (manual — free Apple ID signing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build Release for physical iPhoneOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Yomi.xcodeproj \
            -scheme Yomi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-unsigned-build.log
      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Yomi.app" -path "*Release-iphoneos*" | head -1)
          echo "Built app: $APP_PATH"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify device build (arm64, iOS platform, bundle id, min iOS)
        run: python3 ios/tools/verify_ipa.py "${{ steps.app.outputs.path }}"
      - name: Package Yomi-unsigned.ipa
        run: |
          rm -rf Payload Yomi-unsigned.ipa
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          zip -r -q Yomi-unsigned.ipa Payload
      - name: Verify packaged IPA structure
        run: python3 ios/tools/verify_ipa.py Yomi-unsigned.ipa
      - name: Upload Yomi-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-unsigned-ipa
          path: Yomi-unsigned.ipa
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build-log
          path: ios-unsigned-build.log

  # Optional signed device build. Only runs when triggered manually and when
  # signing secrets are configured in the repository (never committed):
  #   IOS_SIGNING_CERTIFICATE_P12_BASE64 + IOS_SIGNING_CERTIFICATE_PASSWORD
  #   IOS_PROVISIONING_PROFILE_BASE64 + IOS_TEAM_ID
  build-signed-ipa:
    name: Signed device IPA (manual, requires secrets)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: [yomikit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Check for signing secrets
        id: check
        run: |
          if [ -n "${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}" ] && [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured — skipping signed build."
          fi
      - name: Install signing certificate and profile
        if: steps.check.outputs.available == 'true'
        run: |
          echo "${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          rm cert.p12
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Archive and export IPA
        if: steps.check.outputs.available == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ios/Yomi.xcodeproj -scheme Yomi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Yomi.xcarchive \
            archive DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} | tee archive.log
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Yomi.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ExportOptions.plist
      - name: Upload IPA
        if: steps.check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-device-ipa
          path: build/ipa/*.ipa
